services:
  - type: web
    name: akayroom
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    healthCheckPath: /health
    buildCommand: |
      echo "== Frontend ==" && cd frontend && npm install --legacy-peer-deps && npm run build
      echo "== Signaling ==" && cd ../realtime-signaling && npm install
    startCommand: node realtime-signaling/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_WS_URL
        sync: false
      - key: PUBLIC_HTTP_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: JWKS_URL
        sync: false
      - key: JWT_AUDIENCE
        value: authenticated
      - key: AUTH_MODE
        value: generic
      - key: SFU_MODE
        value: signaling
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SIGNALING_URL
        sync: false
      - key: VITE_APP_NAME
        value: Akayroom
